<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wang Yung-An - Portfolio</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #333; 
        }
        .pdf-embed { 
            width: 100%; 
            height: 100vh; 
            border: none; 
        }
        .mobile-fallback { 
            display: none; 
            text-align: center; 
            padding: 20%; 
            color: white; 
            font-family: sans-serif; 
            line-height: 1.5;
        }
        .mobile-fallback a { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 12px 24px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
        }
        
        /* 行動裝置視圖：隱藏 PDF 框架，顯示獨立的按鈕區塊 */
        @media (max-width: 768px) {
            .pdf-embed { display: none; }
            .mobile-fallback { display: block; }
            body, html { overflow: auto; } /* 確保行動裝置可以滾動 */
        }
    </style>
</head>
<body>
    <!-- 使用 iframe 替代 object，在現代瀏覽器中支援度更穩定 -->
    <iframe src="portfolio.pdf" class="pdf-embed" title="Portfolio"></iframe>
    
    <!-- 備用區塊必須獨立於 iframe 之外 -->
    <div class="mobile-fallback">
        <h2>請直接開啟 PDF 檔案</h2>
        <p>為確保互動式超連結與完整排版正常運作，請點擊下方按鈕閱讀。</p>
        <a href="portfolio.pdf" target="_blank">檢視完整作品集</a>
    </div>
</body>
</html>
