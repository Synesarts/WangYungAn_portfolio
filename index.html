<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wang Yung-An - Portfolio</title>
    <style>
        /* 移除邊距，設定深色背景，確保全螢幕沉浸感 */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #333; 
        }
        .pdf-embed { 
            width: 100%; 
            height: 100vh; 
            border: none; 
        }
        .mobile-fallback { 
            display: none; 
            text-align: center; 
            padding: 20%; 
            color: white; 
            font-family: sans-serif; 
            line-height: 1.5;
        }
        .mobile-fallback a { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 12px 24px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
        }
        /* 行動裝置防錯：手機瀏覽器易遮蔽內嵌 PDF 或使超連結失效，故強制切換為直接開啟按鈕 */
        @media (max-width: 768px) {
            .pdf-embed { display: none; }
            .mobile-fallback { display: block; }
        }
    </style>
</head>
<body>
    <!-- 將 data 屬性與 a href 屬性指向您的 PDF 檔名 -->
    <object data="portfolio.pdf" type="application/pdf" class="pdf-embed">
        <div class="mobile-fallback" style="display: block;">
            <h2>請直接開啟 PDF 檔案</h2>
            <p>為確保互動式超連結與完整排版正常運作，請點擊下方按鈕閱讀。</p>
            <a href="portfolio.pdf" target="_blank">檢視完整作品集</a>
        </div>
    </object>
</body>
</html>
